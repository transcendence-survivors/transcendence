services:
  postgres:
    restart: unless-stopped
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  network-server:
    restart: unless-stopped
    build:
      context: ./apps/network/server
    ports:
      - "3001:3001"
      - "51212:51212"
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      NEST_PORT: ${NEST_PORT}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/network/server:/app
      - /app/node_modules

  network-client:
    restart: unless-stopped
    build:
      context: ./apps/network/client
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL}
      NEXT_PUBLIC_CHAT_SOCKET_URL: ${CHAT_SOCKET_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: development
    depends_on:
      - network-server
    volumes:
      - ./apps/network/client:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  game-client:
    restart: unless-stopped
    build:
      context: ./apps/game
      dockerfile: client/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${API_URL}
      VITE_GAME_SOCKET_URL: ${GAME_SOCKET_URL}
      VITE_CHAT_SOCKET_URL: ${CHAT_SOCKET_URL}
      NODE_ENV: development
    depends_on:
      - game-server
    volumes:
      - ./apps/game:/app
      - /app/client/node_modules

  game-server:
    restart: unless-stopped
    build:
      context: ./apps/game
      dockerfile: server/Dockerfile
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: ${GAME_SERVER_PORT}
      API_URL: ${API_URL}
    volumes:
      - ./apps/game:/app
      - /app/server/node_modules

volumes:
  postgres_data:
